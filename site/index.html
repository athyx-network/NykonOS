<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nykon OS — Bare-Metal ARM Operating System</title>
  <meta name="description" content="Nykon OS is a bare-metal operating system for ARM with 60 FPS graphics, custom FAT32 storage, and native apps.">
  <meta name="keywords" content="Nykon OS, Bare Metal OS, ARM Operating System, Peanut GB, Retro OS">
  <meta name="author" content="Nykon OS Team">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==========================================
       Header Navigation
       ========================================== -->
  <header class="navbar">
    <div class="container">
      <a href="#" class="nav-brand">
        <div class="nav-logo-badge">
          <img src="assets/logo.png" alt="Nykon OS Logo" class="nav-logo-img">
        </div>
        <span>NYKON OS</span>
      </a>
    </div>
  </header>

  <!-- ==========================================
       Hero Section & Phone Simulator
       ========================================== -->
  <section class="hero" id="simulator">
    <div class="container">
      <div class="hero-grid">
        
        <!-- Left: Title -->
        <div class="hero-content">
          <h1 class="hero-title">
            Mobile OS built for<br>
            <span class="blue-text">BPI Zero M2</span>
          </h1>
        </div>

        <!-- Right: Phone Device Mockup -->
        <div class="phone-wrapper">
          <div class="phone-glow"></div>
          
          <div class="phone-device">
            <img src="assets/lockscreen.png" alt="Nykon OS Lock Screen" class="phone-screen-img">
          </div>
        </div>

      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
