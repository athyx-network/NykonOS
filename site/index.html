<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nykon OS | Home</title>
  <meta name="description"
    content="Nykon OS is a bare-metal operating system for ARM with 60 FPS graphics, custom FAT32 storage, and native apps.">
  <meta name="keywords" content="Nykon OS, Bare Metal OS, ARM Operating System, Peanut GB, Retro OS">
  <meta name="author" content="Nykon OS Team">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ==========================================
       Header Navigation
       ========================================== -->
  <header class="navbar">
    <div class="container">
      <a href="#" class="nav-brand">
        <div class="nav-logo-badge">
          <img src="assets/logo.png" alt="Nykon OS Logo" class="nav-logo-img">
        </div>
        <span>NYKON OS</span>
      </a>
    </div>
  </header>

  <!-- ==========================================
       Hero Section & Phone Simulator
       ========================================== -->
  <section class="hero" id="simulator">
    <div class="container">
      <div class="hero-grid">

        <!-- Left: Title -->
        <div class="hero-content">
          <h1 class="hero-title">
            Mobile OS built for<br>
            <span class="blue-text">BPI Zero M2</span>
          </h1>
          <div class="hero-actions">
            <a href="https://github.com/athyx-network/NykonOS/releases/tag/OS3" target="_blank" rel="noopener noreferrer" class="btn-download">
              <span>Download Latest Release</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </a>
          </div>
        </div>

        <!-- Right: Phone Device Mockup -->
        <div class="phone-wrapper">
          <div class="phone-glow"></div>

          <div class="phone-device">
            <img src="assets/lockscreen.png" alt="Nykon OS Lock Screen" class="phone-screen-img">
          </div>
        </div>

      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>

</html>
